openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a studio inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryConfirmation"
        "400":
          description: Invalid inquiry
        "429":
          description: Too many submissions
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    InquiryInput:
      type: object
      required: [name, business, email, need, budget, timeline, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        business:
          type: string
          minLength: 1
          maxLength: 180
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          maxLength: 500
        need:
          type: string
          minLength: 1
          maxLength: 120
        budget:
          type: string
          minLength: 1
          maxLength: 120
        timeline:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 5000
        source:
          type: string
          maxLength: 120
        honeypot:
          type: string
          maxLength: 200
    InquiryConfirmation:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

